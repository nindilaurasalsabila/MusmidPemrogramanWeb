<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Mahasiswa - Pre-Order Kantin Kampus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Kantin Kampus</h1>
        <nav>
            <ul>
                <li><a href="index.html">Daftar Menu</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <!-- GUNAKAN CLASS login-container DI SINI -->
    <main class="login-container">
        <h2>Pendaftaran Mahasiswa</h2>

        <form action="login.html" method="POST">
            <div>
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required placeholder="Masukkan nama lengkap">
            </div>

            <div>
                <label for="nim">NIM:</label>
                <input type="text" id="nim" name="nim" required placeholder="Masukkan NIM">
            </div>

            <div>
                <label for="email">Email Student:</label>
                <input type="email" id="email" name="email" required placeholder="nama@student.umm.ac.id">
            </div>

            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Buat password">
            </div>

            <button type="submit">Daftar Sekarang</button>
        </form>

        <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </main>

    <footer>
        <p>&copy; 2026 Pre-Order Kantin Kampus</p>
    </footer>
    <script src="../js/account.js"></script>
</body>
</html>
